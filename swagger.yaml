openapi: 3.0.0
info:
  title: UnaHur Anti-Social Net API
  version: 1.0.0
  description: Documentación del MVP para la red social "UnaHur Anti-Social Net".
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

tags:
  - name: Users
    description: Gestión de usuarios
  - name: Posts
    description: Gestión de publicaciones y sus relaciones
  - name: Comments
    description: Gestión de comentarios
  - name: Tags
    description: Gestión de etiquetas

paths:

  # USERS
  /users:
    get:
      tags: [Users]
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios obtenida con éxito
    post:
      tags: [Users]
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Usuario creado con éxito
        '400':
          description: Error de validación en los datos enviados

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtener un usuario por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado
    put:
      tags: [Users]
      summary: Actualizar un usuario existente
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Usuario actualizado con éxito
        '400':
          description: Error de validación
    delete:
      tags: [Users]
      summary: Eliminar un usuario
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Usuario eliminado con éxito

  # USERS - FOLLOWERS
  /users/{id}/followers:
    get:
      tags: [Users]
      summary: Obtener los seguidores de un usuario
      description: Devuelve la lista de usuarios que siguen al usuario indicado por ID.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Lista de seguidores obtenida con exito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublic'
        '404':
          description: Usuario no encontrado

  /users/{id}/following:
    get:
      tags: [Users]
      summary: Obtener los usuarios seguidos por un usuario
      description: Devuelve la lista de usuarios a los que sigue el usuario indicado por ID.
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Lista de usuarios seguidos obtenida con exito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublic'
        '404':
          description: Usuario no encontrado

  /users/{id}/following/{followedId}:
    post:
      tags: [Users]
      summary: Seguir a un usuario
      description: Crea una relacion donde el usuario indicado por id comienza a seguir al usuario indicado por followedId.
      parameters:
        - $ref: '#/components/parameters/pathId'
        - $ref: '#/components/parameters/pathFollowedId'
      responses:
        '201':
          description: Relacion de seguimiento creada con exito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowRelation'
        '400':
          description: Error de validacion o intento de seguirse a si mismo
        '404':
          description: Usuario seguidor o usuario seguido no encontrado
        '409':
          description: La relacion de seguimiento ya existe
    delete:
      tags: [Users]
      summary: Dejar de seguir a un usuario
      description: Elimina la relacion donde el usuario indicado por id sigue al usuario indicado por followedId.
      parameters:
        - $ref: '#/components/parameters/pathId'
        - $ref: '#/components/parameters/pathFollowedId'
      responses:
        '204':
          description: Relacion de seguimiento eliminada con exito
        '400':
          description: Error de validacion
        '404':
          description: Relacion de seguimiento no encontrada

  # POSTS
  /posts:
    get:
      tags: [Posts]
      summary: Obtener todas las publicaciones
      responses:
        '200':
          description: Lista de publicaciones obtenida con éxito
    post:
      tags: [Posts]
      summary: Crear una nueva publicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '201':
          description: Publicación creada con éxito
        '400':
          description: Error de validación

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Obtener una publicación por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Publicación encontrada
        '404':
          description: Publicación no encontrada
    put:
      tags: [Posts]
      summary: Actualizar una publicación existente
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Publicación actualizada
        '400':
          description: Error de validación
    delete:
      tags: [Posts]
      summary: Eliminar una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Publicación eliminada con éxito

  # POSTS - IMAGES
  /posts/{id}/images:
    post:
      tags: [Posts]
      summary: Asociar una imagen a una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostImage'
      responses:
        '201':
          description: Imagen asociada con éxito
        '400':
          description: Error de validación
  /posts/{id}/images/{imageId}:
    delete:
      tags: [Posts]
      summary: Eliminar una imagen de una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
        - $ref: '#/components/parameters/pathImageId'
      responses:
        '200':
          description: Imagen eliminada con éxito

  # POSTS - TAGS
  /posts/{id}/tags:
    post:
      tags: [Posts]
      summary: Asociar una etiqueta a una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTag'
      responses:
        '201':
          description: Etiqueta asociada con éxito
        '400':
          description: Error de validación
  /posts/{id}/tags/{tagId}:
    delete:
      tags: [Posts]
      summary: Eliminar una etiqueta de una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
        - $ref: '#/components/parameters/pathTagId'
      responses:
        '200':
          description: Etiqueta removida con éxito

  # COMMENTS
  
  /comments:
    get:
      tags: [Comments]
      summary: Obtener todos los comentarios
      responses:
        '200':
          description: Lista de comentarios obtenida
    post:
      tags: [Comments]
      summary: Crear un comentario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '201':
          description: Comentario creado
        '400':
          description: Error de validación

  /comments/{id}:
    get:
      tags: [Comments]
      summary: Obtener un comentario por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Comentario encontrado
        '404':
          description: Comentario no encontrado
    put:
      tags: [Comments]
      summary: Actualizar un comentario
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdate'
      responses:
        '200':
          description: Comentario actualizado
        '400':
          description: Error de validación
    delete:
      tags: [Comments]
      summary: Eliminar un comentario
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Comentario eliminado
  # TAGS
  /tags:
    get:
      tags: [Tags]
      summary: Obtener todas las etiquetas
      responses:
        '200':
          description: Lista de etiquetas obtenida
    post:
      tags: [Tags]
      summary: Crear una etiqueta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '201':
          description: Etiqueta creada
        '400':
          description: Error de validación

  /tags/{id}:
    get:
      tags: [Tags]
      summary: Obtener una etiqueta por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Etiqueta encontrada
        '404':
          description: Etiqueta no encontrada
    put:
      tags: [Tags]
      summary: Actualizar una etiqueta
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
      responses:
        '200':
          description: Etiqueta actualizada
        '400':
          description: Error de validación
    delete:
      tags: [Tags]
      summary: Eliminar una etiqueta
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Etiqueta eliminada

# COMPONENTES REUTILIZABLES
components:
  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    pathImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    pathTagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    pathFollowedId:
      name: followedId
      in: path
      required: true
      description: ID del usuario que va a ser seguido o dejado de seguir
      schema:
        type: integer
        minimum: 1

  schemas:
    User:
      type: object
      required:
        - nickname
        - name
        - password
        - email
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email

    UserPublic:
      type: object
      properties:
        id:
          type: integer
          example: 2
        nickname:
          type: string
          example: maria_gomez
        name:
          type: string
          example: Maria Gomez
        email:
          type: string
          format: email
          example: maria.gomez@email.com

    FollowRelation:
      type: object
      properties:
        followerId:
          type: integer
          example: 1
          description: ID del usuario que sigue
        followedId:
          type: integer
          example: 2
          description: ID del usuario seguido
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email

    Post:
      type: object
      required:
        - description
        - userId
      properties:
        description:
          type: string
          minLength: 1
        userId:
          type: integer
          minimum: 1

    PostUpdate:
      type: object
      properties:
        description:
          type: string
          minLength: 1

    PostTag:
      type: object
      required:
        - tagId
      properties:
        tagId:
          type: integer
          minimum: 1

    Comment:
      type: object
      required:
        - content
        - postId
        - userId
      properties:
        content:
          type: string
          minLength: 1
        postId:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1

    CommentUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1

    Tag:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    TagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    PostImage:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
