openapi: 3.0.0
info:
  title: UnaHur Anti-Social Net API
  version: 1.0.0
  description: Documentación del MVP para la red social "UnaHur Anti-Social Net".
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

tags:
  - name: Users
    description: Gestión de usuarios
  - name: Posts
    description: Gestión de publicaciones y sus relaciones
  - name: Comments
    description: Gestión de comentarios
  - name: Tags
    description: Gestión de etiquetas

paths:

  # USERS
  /users:
    get:
      tags: [Users]
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios obtenida con éxito
    post:
      tags: [Users]
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Usuario creado con éxito
        '400':
          description: Error de validación en los datos enviados

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtener un usuario por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado
    put:
      tags: [Users]
      summary: Actualizar un usuario existente
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Usuario actualizado con éxito
        '400':
          description: Error de validación
    delete:
      tags: [Users]
      summary: Eliminar un usuario
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Usuario eliminado con éxito

  # POSTS
  /posts:
    get:
      tags: [Posts]
      summary: Obtener todas las publicaciones
      responses:
        '200':
          description: Lista de publicaciones obtenida con éxito
    post:
      tags: [Posts]
      summary: Crear una nueva publicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '201':
          description: Publicación creada con éxito
        '400':
          description: Error de validación

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Obtener una publicación por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Publicación encontrada
        '404':
          description: Publicación no encontrada
    put:
      tags: [Posts]
      summary: Actualizar una publicación existente
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
      responses:
        '200':
          description: Publicación actualizada
        '400':
          description: Error de validación
    delete:
      tags: [Posts]
      summary: Eliminar una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Publicación eliminada con éxito

  # POSTS - IMAGES
  /posts/{id}/images:
    post:
      tags: [Posts]
      summary: Asociar una imagen a una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostImage'
      responses:
        '201':
          description: Imagen asociada con éxito
        '400':
          description: Error de validación
  /posts/{id}/images/{imageId}:
    delete:
      tags: [Posts]
      summary: Eliminar una imagen de una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
        - $ref: '#/components/parameters/pathImageId'
      responses:
        '200':
          description: Imagen eliminada con éxito

  # POSTS - TAGS
  /posts/{id}/tags:
    post:
      tags: [Posts]
      summary: Asociar una etiqueta a una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTag'
      responses:
        '201':
          description: Etiqueta asociada con éxito
        '400':
          description: Error de validación
  /posts/{id}/tags/{tagId}:
    delete:
      tags: [Posts]
      summary: Eliminar una etiqueta de una publicación
      parameters:
        - $ref: '#/components/parameters/pathId'
        - $ref: '#/components/parameters/pathTagId'
      responses:
        '200':
          description: Etiqueta removida con éxito

  # COMMENTS
  
  /comments:
    get:
      tags: [Comments]
      summary: Obtener todos los comentarios
      responses:
        '200':
          description: Lista de comentarios obtenida
    post:
      tags: [Comments]
      summary: Crear un comentario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '201':
          description: Comentario creado
        '400':
          description: Error de validación

  /comments/{id}:
    get:
      tags: [Comments]
      summary: Obtener un comentario por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Comentario encontrado
        '404':
          description: Comentario no encontrado
    put:
      tags: [Comments]
      summary: Actualizar un comentario
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdate'
      responses:
        '200':
          description: Comentario actualizado
        '400':
          description: Error de validación
    delete:
      tags: [Comments]
      summary: Eliminar un comentario
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Comentario eliminado
  # TAGS
  /tags:
    get:
      tags: [Tags]
      summary: Obtener todas las etiquetas
      responses:
        '200':
          description: Lista de etiquetas obtenida
    post:
      tags: [Tags]
      summary: Crear una etiqueta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '201':
          description: Etiqueta creada
        '400':
          description: Error de validación

  /tags/{id}:
    get:
      tags: [Tags]
      summary: Obtener una etiqueta por ID
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Etiqueta encontrada
        '404':
          description: Etiqueta no encontrada
    put:
      tags: [Tags]
      summary: Actualizar una etiqueta
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
      responses:
        '200':
          description: Etiqueta actualizada
        '400':
          description: Error de validación
    delete:
      tags: [Tags]
      summary: Eliminar una etiqueta
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: Etiqueta eliminada

# COMPONENTES REUTILIZABLES
components:
  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    pathImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    pathTagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    User:
      type: object
      required:
        - nickname
        - name
        - password
        - email
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email

    UserUpdate:
      type: object
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email

    Post:
      type: object
      required:
        - description
        - userId
      properties:
        description:
          type: string
          minLength: 1
        userId:
          type: integer
          minimum: 1

    PostUpdate:
      type: object
      properties:
        description:
          type: string
          minLength: 1

    PostTag:
      type: object
      required:
        - tagId
      properties:
        tagId:
          type: integer
          minimum: 1

    Comment:
      type: object
      required:
        - content
        - postId
        - userId
      properties:
        content:
          type: string
          minLength: 1
        postId:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1

    CommentUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1

    Tag:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    TagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    PostImage:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
